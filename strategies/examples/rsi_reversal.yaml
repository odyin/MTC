# RSI 反轉策略 - 台指期
name: "RSI_Reversal_TAIEX"
version: "1.0"
description: "RSI 超賣反彈做多，RSI 超買反轉做空"
instrument: "TX"
timeframe: "5m"

indicators:
  - type: rsi
    name: rsi1
    params:
      period: {default: 14, min: 7, max: 28, step: 7}
      source: "close"
  - type: ma
    name: trend_ma
    params:
      period: {default: 50, min: 20, max: 100, step: 10}
      method: "EMA"
      source: "close"

entry:
  long:
    condition: "rsi1 crosses_above 30 and close above trend_ma"
    order_type: "market"
    contracts: 1
  short:
    condition: "rsi1 crosses_below 70 and close below trend_ma"
    order_type: "market"
    contracts: 1

exit:
  stop_loss:
    type: "points"
    value: 80
  take_profit:
    type: "points"
    value: 160
  trailing_stop:
    enabled: true
    value: 60
  time_exit:
    enabled: true
    time: "13:30"

risk:
  max_positions: 1
  max_daily_loss: 250
  session_filter: "day"
